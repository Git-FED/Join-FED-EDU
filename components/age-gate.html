<section id="age-gate" class="age-overlay component-age-gate" hidden aria-modal="true" role="dialog" aria-labelledby="age-title">
  <span class="gate-orb gate-orb-cyan" aria-hidden="true"></span><span class="gate-orb gate-orb-magenta" aria-hidden="true"></span>
  <div class="age-card" data-reveal>
    <p class="kicker">Secure access checkpoint</p>
    <h2 id="age-title">Are you 18 or older?</h2>
    <p>This confirmation is required before payment embeds are displayed.</p>
    <div class="age-actions">
      <button class="button yes" id="age-yes" type="button">Yes, I’m 18+</button>
      <button class="button no" id="age-no" type="button">No, take me back</button>
    </div>
  </div>
</section>
